<section>

  <h1>{{ portalName }}</h1>

  <p>
    Browse available courses, manage enrollments and view your academic profile.
  </p>

  <button
    [disabled]="!isPortalActive"
    (click)="onEnrollClick()">
    Enroll Now
  </button>

  <br><br>

  <p>{{ message }}</p>

  <label>Search Course:</label>

  <input
    type="text"
    [(ngModel)]="searchTerm">

  <p>You searched: {{ searchTerm }}</p>

  <hr>

  <div class="stats">

    <div>
      <h3>12</h3>
      <p>Courses Available</p>
    </div>

    <div>
      <h3>3</h3>
      <p>Enrolled</p>
    </div>

    <div>
      <h3>3.8</h3>
      <p>GPA</p>
    </div>

  </div>

</section>
